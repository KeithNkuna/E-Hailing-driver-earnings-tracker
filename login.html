<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Fleet Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h2>Fleet Portal Login</h2>
  </header>

  <div class="container" style="max-width: 400px; margin-top: 40px;">
    <div class="card">
      <h3 style="margin-bottom: 16px; text-align: center; color: #f8fafc;">Select Your Role</h3>
      
      <form id="login-form">
        <label>Who is logging in?</label>
        <select id="login-role" required style="margin-bottom: 16px;">
          <option value="driver_brother">Driver: Brother (Mon–Fri)</option>
          <option value="driver_terry">Driver: Terry (Sat–Sun)</option>
          <option value="owner">Owner (Full Management)</option>
        </select>

        <div id="owner-pin-group" style="display: none; margin-bottom: 16px;">
          <label>Owner Access PIN</label>
          <input type="password" id="owner-pin" placeholder="Enter 4-digit PIN" />
        </div>

        <button type="submit" style="width: 100%;">Continue to App</button>
      </form>
    </div>
  </div>

  <script>
    const roleSelect = document.getElementById('login-role');
    const pinGroup = document.getElementById('owner-pin-group');

    roleSelect.addEventListener('change', (e) => {
      if (e.target.value === 'owner') {
        pinGroup.style.display = 'block';
      } else {
        pinGroup.style.display = 'none';
      }
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const role = roleSelect.value;

      if (role === 'owner') {
        const pin = document.getElementById('owner-pin').value;
        // Default owner PIN is set to 2026 (you can change this number anytime)
        if (pin !== '2026') {
          alert('Incorrect Owner PIN! (Default is 2026)');
          return;
        }
        localStorage.setItem('fleet_user_role', 'owner');
        localStorage.setItem('fleet_logged_driver', 'Owner');
        window.location.href = 'index.html';
      } else if (role === 'driver_brother') {
        localStorage.setItem('fleet_user_role', 'driver');
        localStorage.setItem('fleet_logged_driver', 'Brother (Mon-Fri)');
        window.location.href = 'log-shift.html';
      } else if (role === 'driver_terry') {
        localStorage.setItem('fleet_user_role', 'driver');
        localStorage.setItem('fleet_logged_driver', 'Terry (Sat-Sun)');
        window.location.href = 'log-shift.html';
      }
    });
  </script>
</body>
</html>
