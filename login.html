<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Fleet Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h2>Fleet Portal Login</h2>
  </header>

  <div class="container" style="max-width: 400px; margin-top: 40px;">
    <div class="card">
      <h3 style="margin-bottom: 16px; text-align: center; color: #f8fafc;">Select Your Profile</h3>
      
      <form id="login-form">
        <label>Who is logging in?</label>
        <select id="login-role" required style="margin-bottom: 16px;">
          <option value="owner">Owner (Full Management)</option>
        </select>

        <div id="owner-pin-group" style="display: block; margin-bottom: 16px;">
          <label>Owner Access PIN</label>
          <input type="password" id="owner-pin" placeholder="Enter 4-digit PIN" />
        </div>

        <button type="submit" style="width: 100%;">Continue to App</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const roleSelect = document.getElementById('login-role');
    const pinGroup = document.getElementById('owner-pin-group');

    // Load custom drivers created by the Owner
    function populateUsers() {
      const drivers = getDrivers();
      // Add drivers to the top of the dropdown
      drivers.slice().reverse().forEach(driverName => {
        const opt = document.createElement('option');
        opt.value = 'driver:' + driverName;
        opt.textContent = 'Driver: ' + driverName;
        roleSelect.insertBefore(opt, roleSelect.firstChild);
      });

      // Default selection to the first driver if drivers exist, otherwise Owner
      roleSelect.selectedIndex = 0;
      togglePinVisibility();
    }

    function togglePinVisibility() {
      if (roleSelect.value === 'owner') {
        pinGroup.style.display = 'block';
      } else {
        pinGroup.style.display = 'none';
      }
    }

    roleSelect.addEventListener('change', togglePinVisibility);

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const selected = roleSelect.value;

      if (selected === 'owner') {
        const pin = document.getElementById('owner-pin').value;
        if (pin !== '2026') {
          alert('Incorrect Owner PIN!');
          return;
        }
        localStorage.setItem('fleet_user_role', 'owner');
        localStorage.setItem('fleet_logged_driver', 'Owner');
        window.location.href = 'index.html';
      } else if (selected.startsWith('driver:')) {
        const driverName = selected.replace('driver:', '');
        localStorage.setItem('fleet_user_role', 'driver');
        localStorage.setItem('fleet_logged_driver', driverName);
        window.location.href = 'log-shift.html';
      }
    });

    populateUsers();
  </script>
</body>
</html>
