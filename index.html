<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Dashboard | Uber Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 16px;">
      <h2 style="margin:0;">Fleet Overview</h2>
      <a href="login.html" style="color:#ef4444; font-size:13px; text-decoration:none; font-weight:600;">Sign Out</a>
    </div>
  </header>

  <div class="container">
    <!-- Smart Fuel Gauge Card -->
    <div class="card">
      <div class="fuel-header">
        <h3 style="margin:0;">Estimated Tank Level</h3>
        <span id="fuel-pct" class="green" style="font-weight:700; font-size:15px;">0%</span>
      </div>
      <div class="gauge-track">
        <div class="gauge-fill" id="fuel-bar" style="width: 0%;"></div>
      </div>
      <div class="gauge-ticks">
        <span>E (Empty)</span>
        <span>1/2</span>
        <span>F (Full)</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:12px; color:#94a3b8;">
        <span id="fuel-detail">Est. R 0.00 left (Burn rate: 28%)</span>
        <a href="#" onclick="setTankSize(); return false;" style="color:#10b981; text-decoration:none; font-weight:600;">Set Full Tank</a>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="loadDashboard('day', this)">Today</button>
      <button class="filter-btn" onclick="loadDashboard('week', this)">7 Days</button>
      <button class="filter-btn" onclick="loadDashboard('month', this)">This Month</button>
      <button class="filter-btn" onclick="loadDashboard('all', this)">All Time</button>
    </div>

    <div class="kpi-grid">
      <div class="card">
        <h3>Gross Earnings</h3>
        <div class="val green" id="kpi-gross">R 0.00</div>
      </div>
      <div class="card">
        <h3>Petrol Spent</h3>
        <div class="val red" id="kpi-petrol">R 0.00</div>
      </div>
      <div class="card">
        <h3>Other Expenses</h3>
        <div class="val red" id="kpi-expenses">R 0.00</div>
      </div>
      <div class="card">
        <h3>Net Fleet Profit</h3>
        <div class="val" id="kpi-net">R 0.00</div>
      </div>
    </div>

    <div class="card">
      <h3>Recent Shifts</h3>
      <div id="recent-list">Loading shifts...</div>
    </div>

    <!-- Owner Driver Management Card -->
    <div class="card" style="margin-bottom: 80px;">
      <h3>Manage Drivers</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="new-driver-name" placeholder="Enter driver name" style="margin-bottom:0; flex:1;" />
        <button type="button" onclick="handleAddDriver()" style="width:auto; padding:0 18px; margin-top:0;">Add</button>
      </div>
      <div id="driver-list"></div>
    </div>
  </div>

  <nav>
    <a href="index.html" class="active">Dashboard</a>
    <a href="log-shift.html">+ Log Shift</a>
    <a href="history.html">History</a>
  </nav>

  <script src="app.js"></script>
  <script>
    // Protect dashboard from non-owner access
    if (localStorage.getItem('fleet_user_role') !== 'owner') {
      window.location.href = 'login.html';
    }

    function renderDrivers() {
      const drivers = getDrivers();
      const listEl = document.getElementById('driver-list');
      if (drivers.length === 0) {
        listEl.innerHTML = '<p style="color:#94a3b8; font-size:13px; margin:0;">No drivers added yet. Add a name above so they can log in.</p>';
        return;
      }
      listEl.innerHTML = drivers.map(name => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #334155;">
          <span style="font-size:14px; font-weight:600; color:#f8fafc;">${name}</span>
          <button type="button" onclick="handleRemoveDriver('${name.replace(/'/g, "\\'")}')" style="width:auto; padding:4px 10px; font-size:12px; background:#ef4444; margin:0;">Remove</button>
        </div>
      `).join('');
    }

    function handleAddDriver() {
      const input = document.getElementById('new-driver-name');
      if (addDriver(input.value)) {
        input.value = '';
        renderDrivers();
      }
    }

    function handleRemoveDriver(name) {
      if (confirm('Remove ' + name + ' from the login list?')) {
        removeDriver(name);
        renderDrivers();
      }
    }

    function setTankSize() {
      const current = localStorage.getItem(TANK_CAPACITY_KEY) || 950;
      const val = prompt('Enter full tank cost in Rands (e.g., 950):', current);
      if (val && !isNaN(val) && Number(val) > 0) {
        localStorage.setItem(TANK_CAPACITY_KEY, Number(val));
        loadDashboard('all');
      }
    }

    async function loadDashboard(timeframe = 'day', btn = null) {
      if (btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      const allLogs = await getLogs();

      // Update Smart Fuel Gauge
      const fuel = estimateFuelStatus(allLogs);
      const bar = document.getElementById('fuel-bar');
      const pctEl = document.getElementById('fuel-pct');
      bar.style.width = fuel.percentage + '%';
      pctEl.textContent = fuel.percentage + '%';

      if (fuel.percentage <= 20) {
        bar.style.backgroundColor = '#ef4444';
        pctEl.className = 'red';
      } else if (fuel.percentage <= 45) {
        bar.style.backgroundColor = '#f59e0b';
        pctEl.style.color = '#f59e0b';
      } else {
        bar.style.backgroundColor = '#10b981';
        pctEl.className = 'green';
      }

      document.getElementById('fuel-detail').textContent =
        `Est. ${formatZAR(fuel.remainingZar)} left of ${formatZAR(fuel.fullTankZar)} (Burn: ${fuel.burnRatePercent}%)`;

      // Update KPI Totals
      const filtered = filterByTimeframe(allLogs, timeframe);
      let gross = 0, petrol = 0, other = 0;
      filtered.forEach(log => {
        gross += Number(log.app_earnings || 0) + Number(log.cash_collected || 0);
        petrol += Number(log.petrol_cost || 0);
        other += Number(log.other_expenses || 0);
      });

      const net = gross - petrol - other;
      document.getElementById('kpi-gross').textContent = formatZAR(gross);
      document.getElementById('kpi-petrol').textContent = formatZAR(petrol);
      document.getElementById('kpi-expenses').textContent = formatZAR(other);

      const netEl = document.getElementById('kpi-net');
      netEl.textContent = formatZAR(net);
      netEl.className = 'val ' + (net >= 0 ? 'green' : 'red');

      const recentHtml = filtered.slice(0, 5).map(l => {
        const shiftGross = Number(l.app_earnings || 0) + Number(l.cash_collected || 0);
        const shiftNet = shiftGross - Number(l.petrol_cost || 0) - Number(l.other_expenses || 0);
        return `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #334155;">
          <div>
            <strong>${l.driver_name || 'Driver'}</strong>
            <div style="color:#94a3b8; font-size:11px; margin-top:2px;">${l.shift_date} | Gross: ${formatZAR(shiftGross)}</div>
          </div>
          <div class="${shiftNet >= 0 ? 'green' : 'red'}" style="font-weight:700;">${formatZAR(shiftNet)}</div>
        </div>`;
      }).join('');

      document.getElementById('recent-list').innerHTML = recentHtml || '<p style="color:#94a3b8; font-size:13px; text-align:center; padding:10px 0;">No shifts logged for this period.</p>';
    }

    renderDrivers();
    loadDashboard('all');
  </script>
</body>
</html>
