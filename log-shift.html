<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Shift | Uber Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 16px;">
      <h2 style="margin:0;">Log Daily Shift</h2>
      <a href="login.html" style="color:#ef4444; font-size:13px; text-decoration:none; font-weight:600;">Sign Out</a>
    </div>
  </header>

  <div class="container">
    <div class="card" style="background:#1e293b; border-color:#3b82f6; margin-bottom:16px;">
      <p style="margin:0; font-size:13px; color:#93c5fd;">Logged in as: <strong id="driver-display" style="color:#fff;">Driver</strong></p>
    </div>

    <!-- Live Vehicle Fuel Gauge Visible to Driver -->
    <div class="card" style="margin-bottom:16px;">
      <div class="fuel-header">
        <h3 style="margin:0;" id="driver-gauge-title">Estimated Tank Level</h3>
        <span id="fuel-pct" class="green" style="font-weight:700; font-size:16px;">0%</span>
      </div>
      <div class="gauge-track">
        <div class="gauge-fill" id="fuel-bar" style="width: 0%;"></div>
      </div>
      <div class="gauge-ticks">
        <span>E (Empty)</span>
        <span>1/2</span>
        <span>F (Full)</span>
      </div>
      <div style="margin-top:8px; font-size:12px; color:#94a3b8;">
        <span id="fuel-detail">Select a vehicle below to check fuel level.</span>
      </div>
    </div>

    <form class="card" id="shift-form" style="margin-bottom: 80px;">
      <label>Select Vehicle</label>
      <select id="car_select" onchange="handleCarSelection()" required>
        <option value="__new__">+ Enter New Car & Registration...</option>
      </select>

      <div id="new-car-fields" style="display:none; background:#0f172a; padding:12px; border-radius:8px; border:1px solid #334155; margin-bottom:14px;">
        <label>Car Make & Model (e.g., Nissan Magnite)</label>
        <input type="text" id="new_car_model" placeholder="Nissan Magnite" />
        <label>Registration Number</label>
        <input type="text" id="new_car_reg" placeholder="AB 12 CD GP" style="margin-bottom:0;" />
      </div>

      <label>Date</label>
      <input type="date" id="shift_date" required />

      <label>Uber App Fares (R)</label>
      <input type="number" step="0.01" id="app_earnings" placeholder="0.00" required />

      <label>Cash Collected from Riders (R)</label>
      <input type="number" step="0.01" id="cash_collected" placeholder="0.00" />

      <label>Petrol Added / Spent (R)</label>
      <input type="number" step="0.01" id="petrol_cost" placeholder="0.00" />

      <label>Other Business Expenses - Data / Carwash / Tolls (R)</label>
      <input type="number" step="0.01" id="other_expenses" placeholder="0.00" />

      <label>Notes (Optional)</label>
      <input type="text" id="notes" placeholder="e.g., Put R500 petrol" />

      <button type="submit">Save Shift Entry</button>
    </form>
  </div>

  <nav id="driver-nav">
    <a href="log-shift.html" class="active">+ Log Shift</a>
  </nav>

  <script src="app.js"></script>
  <script>
    const role = localStorage.getItem('fleet_user_role');
    const assignedDriver = localStorage.getItem('fleet_logged_driver') || 'Driver';
    document.getElementById('driver-display').textContent = assignedDriver;

    if (role === 'owner') {
      document.getElementById('driver-nav').innerHTML = `
        <a href="index.html">Dashboard</a>
        <a href="log-shift.html" class="active">+ Log Shift</a>
        <a href="history.html">History</a>
      `;
    }

    let allLogsCache = [];

    function populateCarDropdown() {
      const cars = getCars();
      const select = document.getElementById('car_select');
      select.innerHTML = '';

      cars.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.reg;
        opt.textContent = `${c.model} (${c.reg})`;
        select.appendChild(opt);
      });

      const newOpt = document.createElement('option');
      newOpt.value = '__new__';
      newOpt.textContent = '+ Enter New Car & Registration...';
      select.appendChild(newOpt);

      handleCarSelection();
    }

    function handleCarSelection() {
      const val = document.getElementById('car_select').value;
      const newFields = document.getElementById('new-car-fields');
      const bar = document.getElementById('fuel-bar');
      const pctEl = document.getElementById('fuel-pct');

      if (val === '__new__') {
        newFields.style.display = 'block';
        document.getElementById('driver-gauge-title').textContent = 'New Vehicle Fuel Gauge';
        bar.style.width = '0%';
        pctEl.textContent = '0%';
        document.getElementById('fuel-detail').textContent = 'Enter car details below and log petrol added.';
        return;
      }

      newFields.style.display = 'none';
      const fuel = estimateFuelForCar(allLogsCache, val);
      document.getElementById('driver-gauge-title').textContent = `${fuel.car.model} (${fuel.car.reg})`;
      bar.style.width = fuel.percentage + '%';
      pctEl.textContent = fuel.percentage + '%';

      if (fuel.percentage <= 20) {
        bar.style.backgroundColor = '#ef4444';
        pctEl.className = 'red';
      } else if (fuel.percentage <= 45) {
        bar.style.backgroundColor = '#f59e0b';
        pctEl.style.color = '#f59e0b';
      } else {
        bar.style.backgroundColor = '#10b981';
        pctEl.className = 'green';
      }

      document.getElementById('fuel-detail').textContent =
        `Est. ${formatZAR(fuel.remainingZar)} left of ${formatZAR(fuel.fullTankZar)} (Est. burn: ${fuel.burnRatePercent}%)`;
    }

    async function initShiftPage() {
      document.getElementById('shift_date').valueAsDate = new Date();
      allLogsCache = await getLogs();
      populateCarDropdown();
    }

    document.getElementById('shift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      let carReg = document.getElementById('car_select').value;
      let carModel = '';

      if (carReg === '__new__') {
        carModel = document.getElementById('new_car_model').value.trim();
        carReg = document.getElementById('new_car_reg').value.trim().toUpperCase();
        if (!carModel || !carReg) {
          alert('Please enter both the Car Make/Model and Registration.');
          return;
        }
        addCar(carModel, carReg, 900);
      } else {
        const found = getCars().find(c => c.reg === carReg);
        carModel = found ? found.model : '';
      }

      const entry = {
        shift_date: document.getElementById('shift_date').value,
        driver_name: assignedDriver,
        car_model: carModel,
        car_reg: carReg,
        app_earnings: Number(document.getElementById('app_earnings').value || 0),
        cash_collected: Number(document.getElementById('cash_collected').value || 0),
        petrol_cost: Number(document.getElementById('petrol_cost').value || 0),
        other_expenses: Number(document.getElementById('other_expenses').value || 0),
        notes: document.getElementById('notes').value
      };

      const ok = await saveLog(entry);
      if (ok) {
        if (role === 'owner') {
          alert('Shift saved! Vehicle fuel gauge updated.');
          window.location.href = 'index.html';
        } else {
          alert('Shift recorded. Thank you!');
          window.location.href = 'login.html';
        }
      }
    });

    initShiftPage();
  </script>
</body>
</html>
