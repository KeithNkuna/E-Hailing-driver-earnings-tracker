<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Shift | Uber Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 16px;">
      <h2 style="margin:0;">Log Daily Shift</h2>
      <a href="login.html" style="color:#ef4444; font-size:13px; text-decoration:none; font-weight:600;">Sign Out</a>
    </div>
  </header>

  <div class="container">
    <div class="card" style="background:#1e293b; border-color:#3b82f6; margin-bottom:16px;">
      <p style="margin:0; font-size:13px; color:#93c5fd;">Logged in as: <strong id="driver-display" style="color:#fff;">Driver</strong></p>
    </div>

    <form class="card" id="shift-form">
      <label>Date</label>
      <input type="date" id="shift_date" required />

      <label>Uber App Fares (R)</label>
      <input type="number" step="0.01" id="app_earnings" placeholder="0.00" required />

      <label>Cash Collected from Riders (R)</label>
      <input type="number" step="0.01" id="cash_collected" placeholder="0.00" />

      <label>Petrol Added / Spent (R)</label>
      <input type="number" step="0.01" id="petrol_cost" placeholder="0.00" />

      <label>Other Business Expenses - Data / Carwash / Tolls (R)</label>
      <input type="number" step="0.01" id="other_expenses" placeholder="0.00" />

      <label>Notes (Optional)</label>
      <input type="text" id="notes" placeholder="e.g., R500 petrol at Engen" />

      <button type="submit">Save Shift Entry</button>
    </form>
  </div>

  <nav id="driver-nav">
    <!-- Restricted Navigation for Drivers -->
    <a href="log-shift.html" class="active">+ Log Shift</a>
  </nav>

  <script src="app.js"></script>
  <script>
    // Enforce role check
    const role = localStorage.getItem('fleet_user_role');
    const assignedDriver = localStorage.getItem('fleet_logged_driver') || 'Brother (Mon-Fri)';
    
    document.getElementById('driver-display').textContent = assignedDriver;

    // If owner is viewing log-shift, give them full navigation back
    if (role === 'owner') {
      document.getElementById('driver-nav').innerHTML = `
        <a href="index.html">Dashboard</a>
        <a href="log-shift.html" class="active">+ Log Shift</a>
        <a href="history.html">History</a>
      `;
    }

    document.getElementById('shift_date').valueAsDate = new Date();

    document.getElementById('shift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const entry = {
        shift_date: document.getElementById('shift_date').value,
        driver_name: assignedDriver,
        app_earnings: Number(document.getElementById('app_earnings').value || 0),
        cash_collected: Number(document.getElementById('cash_collected').value || 0),
        petrol_cost: Number(document.getElementById('petrol_cost').value || 0),
        other_expenses: Number(document.getElementById('other_expenses').value || 0),
        notes: document.getElementById('notes').value
      };

      const ok = await saveLog(entry);
      if (ok) {
        alert('Shift saved successfully!');
        // If driver saved, send them back to login or clear screen. If owner, send to dashboard.
        if (role === 'owner') {
          window.location.href = 'index.html';
        } else {
          alert('Shift recorded. Thank you!');
          window.location.href = 'login.html';
        }
      }
    });
  </script>
</body>
</html>
